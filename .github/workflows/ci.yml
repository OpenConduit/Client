name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx tsc --noEmit

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux packaging deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Build Linux x64
        run: npm run make -- --platform linux --arch x64
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144

      - uses: actions/upload-artifact@v4
        with:
          name: openconduit-linux-x64-${{ github.sha }}
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
          retention-days: 7
