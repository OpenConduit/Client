name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx tsc --noEmit

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@openconduit'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-extract Electron binary
        run: |
          mkdir -p /tmp/electron-dist
          curl -fsSL "https://github.com/electron/electron/releases/download/v42.2.0/electron-v42.2.0-linux-x64.zip" \
            -o /tmp/electron.zip
          unzip -q /tmp/electron.zip -d /tmp/electron-dist
          echo "ELECTRON_DIST_PATH=/tmp/electron-dist" >> $GITHUB_ENV

      - name: Verify Electron setup
        run: |
          echo "=== ELECTRON_DIST_PATH ==="
          echo "$ELECTRON_DIST_PATH"
          echo "=== electron-dist contents ==="
          find /tmp/electron-dist -maxdepth 1
          echo "=== extract-zip version ==="
          node -e "console.log(require('./node_modules/extract-zip/package.json').version)"
          echo "=== yauzl version ==="
          node -e "console.log(require('./node_modules/yauzl/package.json').version)"
          echo "=== @electron/packager version ==="
          node -e "console.log(require('./node_modules/@electron/packager/package.json').version)"
          echo "=== does packager recognise electronDist? ==="
          grep -rl "electronDist" node_modules/@electron/packager/dist/ 2>/dev/null | head -3 || echo "electronDist NOT in packager source — option will be ignored"

      - name: Install Linux packaging deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Build Linux x64
        run: npm run make -- --platform linux --arch x64
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
          DEBUG: 'electron-forge:*,electron-packager,@electron/get:*'

      - name: Post-build diagnostics
        if: always()
        run: |
          echo "=== out/ ==="
          find out 2>/dev/null || echo "out/ missing"
          echo "=== /tmp/electron-packager ==="
          find /tmp/electron-packager -maxdepth 3 2>/dev/null | head -30 || echo "(not found)"

      - uses: actions/upload-artifact@v4
        with:
          name: openconduit-linux-x64-${{ github.sha }}
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error
          retention-days: 7
